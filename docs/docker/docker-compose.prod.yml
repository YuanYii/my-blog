# =============================================================
# 生产环境 Docker Compose（阿里云 ECS 香港轻量，单机部署）
#
# 决策组合（2026-06-07）：
#   A1 境外免备案 / B2 自装 / C3 本地存储 / D4 GitHub + ACR
#
# 修复记录（2026-06-07）：
#   - 拆 frontend + web 两个容器（frontend 跑 Nuxt SSR node，web 跑 nginx 反代）
#   - backend 加 healthcheck（frontend/web depends_on 改 condition: service_healthy）
#   - frontend 加 uploads_data volume → 改由 web 容器挂载
#   - certbot entrypoint 简化（去掉反模式 & wait）
#   - 去掉 mysql-init mount（项目里没此目录）
#
# 启动：
#   cp .env.prod.example .env.prod  # 填入实际值
#   chmod 600 .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 停止：
#   docker compose -f docker-compose.prod.yml down
# 查看日志：
#   docker compose -f docker-compose.prod.yml logs -f backend
# =============================================================

version: '3.8'

services:
  # ---------- MySQL 8.0（自装） ----------
  mysql:
    image: mysql:8.0
    container_name: myblog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-blog}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - myblog-net
    # 不暴露公网端口，仅 backend 容器内访问
    # ports:
    #   - "127.0.0.1:3306:3306"

  # ---------- Redis 7-alpine（自装） ----------
  redis:
    image: redis:7-alpine
    container_name: myblog-redis
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - myblog-net
    # 不暴露公网
    # ports:
    #   - "127.0.0.1:6379:6379"

  # ---------- Backend (Spring Boot 2.7) ----------
  backend:
    image: ${BACKEND_IMAGE:-myblog/backend:latest}
    container_name: myblog-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # DB
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-blog}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # 文件上传
      UPLOAD_DIR: /data/uploads
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourname.com,https://www.yourname.com}
      # JVM
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - uploads_data:/data/uploads
      - ./logs/backend:/var/log/blog
    expose:
      - "8080"
    # 健康检查（容器内 → 8080 → /api/v1/health）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - myblog-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ---------- Frontend (Nuxt 3 SSR) ----------
  frontend:
    build: ../../frontend
    image: ${FRONTEND_IMAGE:-myblog/frontend:latest}
    container_name: myblog-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: http://backend:8080/api/v1
      NODE_ENV: production
    expose:
      - "3000"
    # 健康检查（容器内 → 3000 → /）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - myblog-net
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  # ---------- Web (Nginx 反代 + 静态服务) ----------
  web:
    image: nginx:alpine
    container_name: myblog-web
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-https.conf:/etc/nginx/conf.d/https.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # 关键：让 web 容器看到 backend 写的上传文件
      - uploads_data:/usr/share/nginx/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - myblog-net
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  # ---------- Certbot（Let's Encrypt 自动续期） ----------
  certbot:
    image: certbot/certbot
    container_name: myblog-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done'"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  myblog-net:
    driver: bridge
