# =============================================================
# Nginx HTTPS 配置（443）
# 挂载到 frontend 容器的 /etc/nginx/conf.d/https.conf
# 配套 nginx.conf 在同目录（80 配置）
# =============================================================
#
# [DEPRECATED v2.7.0+]
# 本文件适用于 v2.7.0 之前的容器部署模式（frontend 跑 node SSR 容器）。
# v2.7.0 起前端改为全静态 + nginx:alpine serve，HTTPS 配置改用：
#   - 开发/自签测试：backend 目录下的 nginx 配置（terraform 管理）
#   - 生产 apt 装 nginx：/etc/nginx/sites-available/myblog（由 deploy-server.sh 生成）
# 本文件保留仅作历史参考，不再维护。

server {
    listen 443 ssl http2;
    server_name yourname.com www.yourname.com;

    # ---------- SSL 证书（Let's Encrypt） ----------
    ssl_certificate /etc/letsencrypt/live/yourname.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourname.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 客户端 body 大小（图片上传限制）
    client_max_body_size 20m;

    # ---------- gzip ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # ---------- 日志 ----------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ---------- 限流（防刷） ----------
    # API 通用：20 req/s + 40 burst
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # 登录接口：5 req/min + 3 burst（防爆破）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ---------- 前端 SSR（Nuxt 3 node 服务，frontend 容器 3000） ----------
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 本地上传文件（决策 C3：本地存储） ----------
    # web 容器挂载 uploads_data volume 到 /usr/share/nginx/uploads
    # ^~ 修饰符：精确匹配，优先于正则和 / 反代
    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";

        # 防盗链（可选：只允许 yourname.com 引用）
        # valid_referers none blocked yourname.com www.yourname.com;
        # if ($invalid_referer) { return 403; }
    }

    # ---------- API 反代（修复 2026-06-07：context-path 在 backend 配置，nginx 改 /api/v1/ 匹配） ----------
    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ---------- 登录接口单独限流 ----------
    location ~ ^/api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 健康检查 ----------
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
