# =============================================================
# Nginx 配置：HTTPS + 反向代理 + 限流 + 本地静态资源
# 挂载到 frontend 容器的 /etc/nginx/conf.d/default.conf
# 配套 nginx-https.conf 在同目录（443 配置）
# 详细方案见 docs/阿里云部署方案.md
# =============================================================

# ---------- 80 端口：HTTP → HTTPS 跳转 + Certbot 校验 ----------
server {
    listen 80;
    server_name yourname.com www.yourname.com;

    # Certbot 校验路径（不能 301，否则校验失败）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
