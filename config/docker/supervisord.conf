; =============================================================
; supervisord 配置：容器内 init 进程
;
; 设计：
;   - 管 redis 和 nginx 两个常驻服务（容器一启动就跑）
;   - myblog 由 deploy-server.sh 在 §8 主动 deploy-server.sh manage，
;     **autostart=false** 不随容器自动启动（跟生产 systemd 行为一致：
;     systemd unit 也是 deploy 脚本写完后才 enable/restart）
;
; supervisord 命令行常用：
;   supervisorctl status                 # 看三个进程状态
;   supervisorctl restart myblog         # 部署完重启后端（替代 systemctl restart myblog）
;   supervisorctl tail -f myblog         # 实时看后端日志（替代 journalctl -u myblog -f）
;   supervisorctl reread && supervisorctl update   # 修改本配置后重载
; =============================================================

[supervisord]
nodaemon=true                    ; 容器 PID 1 必须前台跑，否则容器秒退
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; =============================================================
; myblog 程序配置由 deploy-server.sh §8 写到 /etc/supervisor/conf.d/myblog.conf
; 这里不再 baked [program:myblog]，避免重复 + 失效（修复 #4）
; 容器首次启动时 conf.d/myblog.conf 不存在 → supervisorctl status 看不到 myblog
; 跟生产 systemd 行为一致：systemd unit 写之前也"不知道" myblog
; =============================================================
[include]
files = /etc/supervisor/conf.d/*.conf

[program:redis]
; 用 supervisord 跑 redis，前台模式（daemonize=no），不让 redis 自己 fork 走
command=/usr/bin/redis-server --daemonize no --appendonly no --maxmemory 128mb --dir /opt/myblog/db
directory=/opt/myblog/db
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/opt/myblog/logs/redis-stdout.log
stderr_logfile=/opt/myblog/logs/redis-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:nginx]
; nginx 前台模式（daemon off），容器 PID 1 由 supervisord 持有
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/opt/myblog/logs/nginx-stdout.log
stderr_logfile=/opt/myblog/logs/nginx-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB