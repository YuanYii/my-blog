change_summary: "完成公开接口信息泄露防护、后台路由规范化、封面图自适应渲染、三态昼夜主题自适应控制与文章详情页二维码分享功能"
design_decisions:
  api_changes:
    - method: "GET"
      path: "/api/v1/articles"
      response_schema: "toPublicMap: 包含 coverUrl，移除 status, createdAt, updatedAt, contentMd"
    - method: "GET"
      path: "/api/v1/articles/archives"
      response_schema: "toPublicMap: 包含 coverUrl，移除 status, createdAt, updatedAt, contentMd"
    - method: "GET"
      path: "/api/v1/articles/{slug}"
      response_schema: "toPublicMap: 包含 coverUrl 与 contentMd，移除 status, createdAt, updatedAt"
    - method: "GET"
      path: "/api/v1/articles/{id}/attachment"
      security: "强制校验 parent article status=1 AND deleted=0，否则 404"
    - method: "GET"
      path: "/api/v1/articles/admin/detail/{id}"
      security: "由 /articles/id/{id} 迁移至 /articles/admin/detail/{id}，AdminAuthFilter 统一鉴权"
    - method: "GET"
      path: "/api/v1/comments"
      response_schema: "移除 SQL 投影中的 c.status 字段"
  ui_changes:
    - target: "frontend/pages/index.vue"
      description: "post-card 增加图文双栏布局与 post-card-thumb 条件缩略图渲染"
    - target: "frontend/assets/css/main.css"
      description: "增加 post-card-inner、post-card-thumb、post-hero-cover 样式及响应式折叠"
    - target: "frontend/pages/post/[slug].vue"
      description: "正文头部增加 post-hero-cover 大图 Banner，顶部元数据与文末增加分享入口，挂载 ShareModal"
    - target: "frontend/utils/qrcode.ts"
      description: "纯 TS 轻量级 QR Code 编码器与 Canvas 渲染器"
    - target: "frontend/components/ShareModal.vue"
      description: "微信/手机扫码分享模态弹窗，提供复制链接与下载二维码"
    - target: "frontend/composables/useSiteTheme.ts"
      description: "重构支持 auto/light/dark 三态与 prefers-color-scheme 实时监听"
    - target: "frontend/components/NavBar.vue"
      description: "导航栏按钮升级为三态循环切换，动态 SVG 图标与 Tooltip"
    - target: "frontend/app.vue"
