version: "2.0"
run_id: "20260820"
created_at: "2026-08-20T09:10:00+08:00"
tasks:
  - id: "20260820-DEV-001"
    title: "仅链接可见文章 (Unlisted Post) 全链路支持与权限隔离"
    type: "DEV"
    priority: "P1"
    scope:
      impacted_modules: ["backend/blog-article", "backend/blog-app", "frontend"]
      target_files:
        - "backend/blog-app/src/main/java/com/blog/common/security/AdminAuthFilter.java"
        - "backend/blog-article/src/main/java/com/blog/article/entity/Article.java"
        - "backend/blog-article/src/main/java/com/blog/article/controller/ArticleController.java"
        - "backend/blog-article/src/main/java/com/blog/article/service/ArticleService.java"
        - "frontend/assets/css/main.css"
        - "frontend/composables/usePublicApi.ts"
        - "frontend/pages/index.vue"
        - "frontend/pages/post/[slug].vue"
        - "frontend/pages/admin/edit.vue"
        - "frontend/pages/admin/posts.vue"
    user_stories:
      - id: "US-01"
        as_a: "博客管理员"
        i_want: "能够发布仅链接可见的文章，且在登录后能在主页列表看到带有专属徽章的文章"
        so_that: "方便小范围私密分享与文章传阅"
      - id: "US-02"
        as_a: "受邀访客"
        i_want: "通过直接链接打开并阅读仅链接可见文章的正文"
        so_that: "阅读分享内容而无需登录"
    acceptance_criteria:
      - id: "AC-01"
        description: "未登录普通访客访问 GET /api/v1/articles 不返回 status=3 的文章"
      - id: "AC-02"
        description: "已登录管理员访问 GET /api/v1/articles 携带 Bearer token 可返回 status IN (1,3) 的文章"
      - id: "AC-03"
        description: "任何人通过 GET /api/v1/articles/{slug} 访问 status=3 文章可正常获取正文"
      - id: "AC-04"
        description: "文章详情页对 status=3 文章注入 noindex, nofollow meta 标签与仅链接提示条"
      - id: "AC-05"
        description: "Sitemap / Archives / SEO 预渲染隔离 status=3 文章"
      - id: "AC-06"
        description: "后台 edit.vue 支持选择 status=3 保存，posts.vue 支持 status=3 徽章与筛选"
    constraints:
      - "不改表结构，复用 status=3 取值"
      - "双 profile（SQLite + MySQL）跨方言兼容"
