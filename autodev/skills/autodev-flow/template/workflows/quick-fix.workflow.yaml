version: "2.0"
name: "quick-fix-flow"
description: "快捷修补工作流图（跳过需求分析，直接修补→审查→审计→集成测试→门控复核）"

metadata:
  author: "autodev-core"
  created_at: "2026-08-03"

nodes:
  - id: develop
    name: "缺陷快速修补"
    agent_role: "DEV"
    instruction_file: "references/LLM-02-developer.md"
    inputs: []
    outputs:
      - "autodev/contracts/{RUN}-stage2-codechange.yaml"

  - id: review
    name: "代码审查"
    agent_role: "REVIEWER"
    instruction_file: "references/LLM-03-code-reviewer.md"
    inputs:
      - "autodev/contracts/{RUN}-stage2-codechange.yaml"
    outputs:
      - "autodev/contracts/{RUN}-stage3-review.yaml"

  - id: bug_fix
    name: "缺陷修补节点"
    agent_role: "DEV"
    instruction_file: "references/LLM-02-developer.md"
    inputs:
      - "autodev/contracts/{RUN}-stage3-review.yaml"
    outputs:
      - "autodev/contracts/{RUN}-stage2-codechange.yaml"

  - id: test_audit
    name: "需求验收审计"
    agent_role: "TESTER"
    instruction_file: "references/LLM-04-test-engineer.md"
    inputs:
      - "autodev/contracts/{RUN}-stage3-review.yaml"
    outputs:
      - "autodev/contracts/{RUN}-stage4-testaudit.yaml"

  - id: integration_test
    name: "集成测试"
    agent_role: "INTEGRATION_TESTER"
    instruction_file: "references/LLM-05-integration-tester.md"
    inputs:
      - "autodev/contracts/{RUN}-stage4-testaudit.yaml"
    outputs:
      - "autodev/contracts/{RUN}-stage5-integration.yaml"

  - id: gate_check
    name: "门控复核"
    agent_role: "PM_GATE"
    instruction_file: "references/LLM-06-project-manager.md"
    inputs:
      - "autodev/contracts/{RUN}-stage3-review.yaml"
      - "autodev/contracts/{RUN}-stage4-testaudit.yaml"
      - "autodev/contracts/{RUN}-stage5-integration.yaml"
    outputs:
      - "autodev/contracts/{RUN}-stage6-gate.yaml"

  - id: doc_engineer
    name: "文档同步"
    agent_role: "DOC_ENGINEER"
    instruction_file: "references/LLM-07-doc-engineer.md"
    inputs:
      - "autodev/contracts/{RUN}-stage6-gate.yaml"
    outputs: []

edges:
  - from: develop
    to: review

  - from: review
    to: bug_fix
    max_trigger_count: 3
    condition:
      contract_ref: "autodev/contracts/{RUN}-stage3-review.yaml"
      field: "overall_result"
      operator: "=="
      value: "REJECTED"

  - from: bug_fix
    to: review

  - from: review
    to: test_audit
    condition:
      contract_ref: "autodev/contracts/{RUN}-stage3-review.yaml"
      field: "overall_result"
      operator: "=="
      value: "PASSED"

  - from: review
    to: test_audit
    condition:
      contract_ref: "autodev/contracts/{RUN}-stage3-review.yaml"
      field: "overall_result"
      operator: "=="
      value: "BLOCK"

  - from: review
    to: test_audit
    is_default: true

  - from: test_audit
    to: integration_test

  - from: integration_test
    to: gate_check

  - from: gate_check
    to: doc_engineer
    condition:
      contract_ref: "autodev/contracts/{RUN}-stage6-gate.yaml"
      field: "overall_result"
      operator: "=="
      value: "PASSED"

  - from: gate_check
    to: null
    condition:
      contract_ref: "autodev/contracts/{RUN}-stage6-gate.yaml"
      field: "overall_result"
      operator: "=="
      value: "BLOCKED"

