# =============================================================
# 生产环境配置（部署到洛杉矶 1C2G ECS，无 docker）
# 2026-06-17 v2.6.0：默认改用 SQLite + 本地 redis（jar 启动 + system redis-server）
# 切回 MySQL：spring.profiles.active=prod,mysql
#
# 启动方式：
#   1. apt install openjdk-8-jdk redis-server  # 系统服务
#   2. systemctl start redis-server
#   3. 跑 schema-sqlite.sql 初始化 /data/blog.db
#   4. java -jar blog-app.jar --spring.profiles.active=prod
# =============================================================
# 注意：profile-specific 文件（application-prod.yml）里不能再写 spring.profiles.active，
# 否则 Spring Boot 抛 InvalidConfigDataPropertyException。active profile 由启动命令传入。

spring:
  # ---------- SQLite（生产默认，无 docker） ----------
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${SQLITE_PATH:/data/blog.db}
    hikari:
      # SQLite 单写者锁：必须 1 个连接
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
      pool-name: blog-sqlite-pool

  # ---------- Redis（apt 装的 redis-server） ----------
  # 1C2G 无 docker，redis 走系统服务（apt install redis-server）
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
    timeout: 5s
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 1

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ---------- HTTP Server ----------
# 1C2G 调小：max-threads=50（每个 ~512KB 栈，50 线程=25MB 栈，留更多给 heap + file cache）
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css
  tomcat:
    max-threads: 50
    max-connections: 2048
    accept-count: 50
    connection-timeout: 5000

# ---------- 业务配置 ----------
blog:
  # JWT
  jwt:
    secret: ${JWT_SECRET}              # 32+ 位强随机（部署时必须设）
    expiration-ms: 86400000            # 24h

  # 文件上传配置（**本地存储**，容器/jar 内路径 /data/uploads）
  upload:
    provider: local
    local:
      dir: ${UPLOAD_DIR:/data/uploads}
      url-prefix: /uploads/
    # oss 配置（首期不启用）
    # oss:
    #   endpoint: ${OSS_ENDPOINT}
    #   bucket: ${OSS_BUCKET}
    #   access-key: ${OSS_ACCESS_KEY}
    #   secret-key: ${OSS_SECRET_KEY}
    #   cdn-domain: ${OSS_CDN_DOMAIN:}

  # CORS（**生产环境收紧**，只允许你自己的域名）
  cors:
    allowed-origins: ${CORS_ORIGINS:https://yourname.com,https://www.yourname.com}

  # Swagger（**生产关闭**）
  swagger:
    enabled: false

# 生产环境关闭 springdoc 自动配置
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ---------- 日志（REQ-LOG-2026-06-18） ----------
# appender / 级别 / 滚动 / 路径全部由 logback-spring.xml 统一管理：
#   - prod 落 /opt/myblog/logs/，按天 + 100MB 滚动，30 天 / 3GB 上限，异步写
#   - prod **强制关闭 CONSOLE**（FR-6.5）：systemd 把 stdout 重定向到 app.log，
#     若再开 CONSOLE 会与 Logback 文件双写，绕过 3GB 容量预算
# 这里不再配 logging.file / logging.level / logging.pattern，避免与 logback-spring.xml 冲突。
