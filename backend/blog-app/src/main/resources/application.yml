spring:
  profiles:
    active: dev

  application:
    name: blog-backend

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.blog.**.entity

blog:
  security:
    # 全站 IP 限流 + 封禁（2026-06-18 新增，IpRateLimitFilter）
    # 同一 IP 1 秒内请求数超过 max-requests-per-second → 封禁 ban-duration-minutes 分钟
    # （封禁记录持久化在 ip_ban 表，admin 后台 GET/PUT /admin/ip-bans 可查看/手动解封）
    ip-rate-limit:
      enabled: true
      max-requests-per-second: 20
      ban-duration-minutes: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
