# 2026-06-17 v2.6.0：dev 默认改用 SQLite（之前是 MySQL）
# 切回 MySQL：spring.profiles.active=dev,mysql
spring:
  datasource:
    # SQLite（dev 默认）
    # 2026-06-17 v2.6.0-fix：用 ${SQLITE_PATH} 绝对路径（避免 ${user.dir} 在 spring-boot:run 下指向 blog-app/ 而非 backend/）
    driver-class-name: org.sqlite.JDBC
#    url: jdbc:sqlite:${SQLITE_PATH:${user.dir}/../blog.db}
    url: jdbc:sqlite:/Users/yuanyi/MyProject/vibeP/my-blog/backend/blog.db
    hikari:
      # SQLite 单写者锁：必须 1 个连接，否则并发写 SQLITE_BUSY
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
      pool-name: blog-sqlite-pool

  # Redis（dev 用本机 docker 起的 redis）
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

blog:
  upload:
    local:
      # dev 用项目内 tmp/ 目录（Git ignore）
      dir: ${UPLOAD_DIR:${user.dir}/tmp/blog-uploads}

# 日志体系（REQ-LOG-2026-06-18）：appender / 级别 / 滚动 / 路径全部由
# logback-spring.xml 统一管理（dev 落 /tmp/blog-dev-logs，CONSOLE+FILE 双写）。
# 这里不再配 logging.level / logging.pattern，避免与 logback-spring.xml 冲突。
